[project]
name = "ocr-pipeline"
version = "0.1.0"
description = "Real-time OCR auto-fill system for Indian PAN and Aadhaar cards"
readme = "README.md"
license = { text = "MIT-0" }
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "pytesseract>=0.3.10",
    "onnxruntime>=1.18.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "click>=8.1.7",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
paddle = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
ocr-extract = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocr_pipeline", "cli", "benchmark"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
